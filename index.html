<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ameer Abdullah — Data Science Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-subtle: #f3f4f6;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --text: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --accent-soft: #eff6ff;
      --status-green: #16a34a;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 10px;
      --max-width: 1040px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 84px;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== NAVIGATION ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 250, 250, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .nav-logo {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--status-green);
    }

    .nav-toggle {
      display: none;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 1rem;
      cursor: pointer;
    }

    /* ===== HERO ===== */
    #hero {
      padding: 88px 0 72px;
    }

    .hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 14px;
    }

    h1.hero-name {
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .hero-bio {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 640px;
      margin-bottom: 32px;
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 56px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--text);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1f2937;
    }

    .btn-secondary {
      background-color: var(--surface);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .btn-secondary:hover {
      background-color: var(--surface-subtle);
      border-color: #9ca3af;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .stat-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .stat-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ===== SECTIONS ===== */
    section.section {
      padding: 72px 0;
      border-top: 1px solid var(--border);
    }

    .section-header {
      margin-bottom: 40px;
    }

      font-family: var(--font-mono);
      font-size
